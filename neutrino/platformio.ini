; ===================== ESP32-S3 Targets =====================

; LilyGO T-Dongle S3 (ST7789 240x135 over SPI)
[env:esp32s3-tdongle]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_raw = yes
build_flags =
  ${env.build_flags}
  -DARCH_ESP32 -DPORT_ARDUINO
  -DVARIANT_TDONGLE_S3
  -Ivariant/lilygo-tdongle-s3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DNEU_UART_CONSOLE_IDX=0
  -DNEU_UART_CONSOLE_BAUD=115200
  -DNEU_USE_SGFX
  -DSGFX_BUS_SPI=1
  -DSGFX_DRV_ST7735=1
  -DSGFX_W=160
  -DSGFX_H=80
  -DSGFX_ROT=1
  -DSGFX_PIN_SCK=5
  -DSGFX_PIN_MOSI=3
  -DSGFX_PIN_MISO=-1
  -DSGFX_PIN_CS=4
  -DSGFX_PIN_DC=2
  -DSGFX_PIN_RST=1
  -DSGFX_PIN_BL=37
  -DSGFX_SPI_HZ=40000000
  -DSGFX_HAL_ARDUINO_GENERIC=1
  -DSGFX_SCRATCH_BYTES=4096
  -DSGFX_ST7735_COLSTART=26
  -DSGFX_ST7735_ROWSTART=1
  -DSGFX_ST77XX_BGR=1
  -DSGFX_ST77XX_INVERT=1
build_src_filter =
  +<src/**>
  -<src/main.c>
  +<arch/esp32/arduino/**>

; LilyGO T-Pager (ST7796 480x222 SPI, TCA8418 keyboard, BQ27220 battery)
; Pins verified against SGFX/examples/example_wrapup lilygo-tpager-st7796 env
[env:esp32s3-tpager]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.psram = enabled
monitor_speed = 115200
monitor_raw = yes
build_flags =
  ${env.build_flags}
  -DARCH_ESP32 -DPORT_ARDUINO
  -DVARIANT_TPAGER
  -Ivariant/lilygo-tpager
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DNEU_UART_CONSOLE_IDX=0
  -DNEU_UART_CONSOLE_BAUD=115200
  -DNEU_USE_SGFX
  -DSGFX_BUS_SPI=1
  -DSGFX_DRV_ST7796=1
  -DSGFX_W=480
  -DSGFX_H=222
  -DSGFX_ROT=3
  -DSGFX_PIN_SCK=35
  -DSGFX_PIN_MOSI=34
  -DSGFX_PIN_MISO=-1
  -DSGFX_PIN_CS=38
  -DSGFX_PIN_DC=37
  -DSGFX_PIN_RST=-1
  -DSGFX_PIN_BL=42
  -DSGFX_SPI_HZ=80000000
  -DSGFX_SPI_CHUNK_BYTES=16384
  -DSGFX_HAL_ARDUINO_GENERIC=1
  -DSGFX_SCRATCH_BYTES=8192
  -DSGFX_ST7796_BGR=1
  -DSGFX_ST7796_INVERT=1
  -DSGFX_ST7796_COLSTART=49
  -DSGFX_ST7796_ROWSTART=0
  -DSGFX_ST7796_MIRROR_Y=1
  -DSGFX_RGB565_BYTESWAP=1
  ; SIC: T-Pager peripherals
  -DNEU_USE_SIC
  -DSIC_AUDIO_NO_COMPAT
  -DI2C_SDA_PIN=3
  -DI2C_SCL_PIN=2
  -DTCA8418_INT_PIN=255
  -DSIC_DRV_KBD_TCA8418=1
  -DSIC_NO_DRV_KBD_74HC138=1
  -DSIC_BATTERY_BQ27220=1
  -DSIC_DRV_ENCODER_GPIO=1
  -DSIC_DRV_CODEC_ES8311=1
  ; ES8311 audio codec I2S pins (MCLK=10, BCLK=11, WS=18, DOUT=45, DIN=17)
  -DES8311_MCLK_PIN=10
  -DES8311_BCLK_PIN=11
  -DES8311_WS_PIN=18
  -DES8311_DOUT_PIN=45
  -DES8311_DIN_PIN=17
build_src_filter =
  +<src/**>
  -<src/main.c>
  +<arch/esp32/arduino/**>

