
[platformio]
default_envs = native
src_dir = .

[env]
lib_ldf_mode = deep+
lib_compat_mode = off
lib_extra_dirs =
  lib
build_flags =
  -DNEU_VERSION=\"1.0\"
  -DKONSOLE_FW_NAME=\"neutrino\"
  -DKONSOLE_FW_VERSION=\"1.0\"

[env:native]
platform = native
build_flags =
  ${env.build_flags}
  -DVARIANT_NATIVE
  -Ivariant/native
build_src_filter =
  +<src/**>
  +<arch/native/posix/**>

[env:esp32-vanilla]
platform = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
monitor_raw = yes
build_flags =
  ${env.build_flags}
  -DARCH_ESP32
  -DPORT_ARDUINO
  -DVARIANT_ESP32DEV
  -Ivariant/esp32dev
build_src_filter =
  +<src/**>
  -<src/main.c>
  +<arch/esp32/arduino/**>

